# Non-secret run configuration. Secrets live in .env (gitignored).
#
# The measured system is FROZEN (see frozen_system_policy in mapping/fatura_field_map.yaml).
# These model ids must match what the product actually runs; they are RECORDED here, not chosen
# here. Defaults mirror ai_backend's own fallbacks.

paths:
  ai_backend: "../docuxray_ai_backend"
  # One entry per dataset, named by DatasetEntry.root_config_key in registry.py.
  # Relative paths resolve against this file's directory, so the same config works on the
  # macOS checkout and in the sandbox where the folders are mounted elsewhere.
  # NOTE 2026-09-03: the parent folder was renamed DocuXray_benchmark -> Benchmark, which left
  # this path dangling and would have failed every run at the pre-flight image check.
  dataset:        "../../Benchmark/FATURA_invoices_dataset"
  # The FULL SROIE task-3 corpus, materialised by scripts/prepare_sroie_full.py: 958 documents
  # under their ORIGINAL ICDAR ids, tagged with the original train/test split (621/337).
  # It supersedes .../sroie_data/SROIE, which is the 626-file TRAIN split only, renumbered
  # "000".."625" by the GitHub repo it came from. That root is left in place so runs reported
  # against it stay reproducible; every one of its 621 distinct images is present here, and the
  # response cache is keyed on image bytes, so nothing already paid for is paid for twice.
  dataset_sroie:  "../../Benchmark/sroie_data/SROIE_FULL"
  # CORD-v2, materialised by scripts/prepare_cord_v2.py. One root holding all three splits:
  # <root>/{train,dev,test}/{images,annotations}. 800 / 100 / 100.
  dataset_cord:   "../../Benchmark/data/CORD_v2"

models:
  # ai/extraction/gemini_extraction_service.py:100  -> os.getenv("GEMINI_MODEL", ...)
  extraction: "gemini-3-flash-preview"
  # ai/judge/core/client.py:16                      -> os.environ.get("GEMINI_JUDGE_MODEL", ...)
  judge:      "gemini-3-flash-preview"

run:
  doc_type: receipt
  # longer identifies the ground truth, since a doc type might have multiple datasets.
  #   fatura     10,000 synthetic invoices, 50 templates, NO line-item ground truth
  dataset: sroie
  # What the extractor is fed. The app never extracts from the uploaded file -- it extracts
  # from the quality stage's clean image, and on the modal path those bytes are a
  # convert("RGB") + default-quality JPEG re-encode of the source (ai/quality/rotation.py:170)
  # stored under a .jpg key (shared/s3.py:67).
  #   quality_clean_jpeg  reproduce that re-encode          <- measures what ships
  #   source_bytes        pass the source file through      <- the no-detection branch
  # Changing this changes the pixels the model sees, so it is part of the response cache key.
  image_prep: quality_clean_jpeg
  # Three arms. Two are durable artifacts in production; the third is a scoring construct.
  #   RAW               = extraction + extraction_postprocessing
  #                       == pages.$.extraction_postprocessing_result
  #                       == exactly what judge_worker.py:88 feeds the judge
  #   RAW_POSTPROCESSED = RAW + the type postprocessor. NOT A PIPELINE STATE -- production
  #                       never builds this document and no model ever sees it. It exists
  #                       because NumericValue sets extra="forbid", so RAW carries only
  #                       originalValue and is scored by the BENCHMARK's number parser while
  #                       FINAL is scored by the PRODUCT's. Measured on runs/main: that
  #                       asymmetry alone accounted for 65 of 125 "judge fixes". Do not
  #                       "fix" the pipeline to match this arm.
  #   FINAL             = RAW + judge + refinement + postprocessing
  #                       == pages.$.postprocessing_result (shipped)
  # The intermediates (bare extraction, refined-before-postprocessing) are written to
  # runs/<id>/stages/ for inspection but are not scored: they are deterministic from
  # (RAW, judge report), both of which are cached. See scripts/derive_arms.py.
  arms: [RAW, RAW_POSTPROCESSED, FINAL]
  concurrency: 2         # each doc fans out to 4 extraction parts then 5 judge sections;
                         # 4 docs = up to 20 concurrent calls, which trips rate limiting
                         # (sync mode only -- batch mode submits one job and waits)
  # HOW THE TWO PAID STAGES REACH GEMINI. Not part of the frozen system: it changes how the
  # bytes are fetched, not what is asked or what is measured.
  #   sync   one interactive call per part/section, `concurrency` documents at a time. This
  #          is the path production runs, and the default.
  #   batch  the Gemini Batch API. Every extraction part and judge section in the plan goes
  #          out as ONE job; the runner waits, writes the results into the response cache,
  #          then runs the plan against that cache. 50% of the interactive price, one wait
  #          instead of N, and `concurrency` stops mattering because nothing is in flight.
  # Two differences from sync are real and are recorded rather than hidden: a batch request
  # gets one shot where `_run_parts` retries three times (a broken part is retried here
  # synchronously, at full price), and there is no think-token stream (already disabled in
  # this harness by job_id=None). The cache key is deliberately IDENTICAL for both modes --
  # same model, prompt, schema and prepared bytes means the same measurement -- so an
  # existing cache stays valid and switching modes never re-pays.
  model_mode: sync
  batch:
    stages: [extract, judge]   # judge needs extraction first: its key hashes what it verifies
    poll_interval_s: 30
    job_timeout_s: 86400       # Gemini's own SLO. Giving up does not cancel the job; --resume
                               # picks it back up from runs/<id>/batch/<stage>.json.
    # Inlined requests ride in the create call itself, so a job is bounded by payload size,
    # not just count: one extraction part carries a ~1024px JPEG.
    max_requests_per_job: 200
    max_mb_per_job: 18
  # Hard per-stage wall-clock budgets, in seconds. These are what stops a run from freezing.
  # ai/llm builds genai.Client with no http_options (gemini_provider.py:83), so there is no HTTP
  # read timeout, and the judge waits on its 5 sections with as_completed and no timeout
  # (judge.py:705) -- one section that never returns hangs that document forever. Extraction has
  # max_retries=3 with backoff; the judge has no retry path at all.
  # judge is deliberately generous: a legitimate `totals` section has been measured at 136s.
  stage_timeouts:
    extract: 300
    judge:   420
    free:     60          # the three no-model stages: extraction_postprocessing, refine, postprocess
  # Hard stop. The runner aborts and writes a partial manifest rather than overrunning.
  spend_cap_usd: 250.0
  # Abort if the first N documents project past the cap.
  early_abort_after: 10

scoring:
  # WHICH ARM THE JUDGE IS MEASURED AGAINST. Two keys, deliberately, because they answer
  # two different questions and collapsing them into one is an 11-point error.
  #
  #   judge_baseline_arm  what fields_fixed / fields_harmed / net_lift / harm_rate compare
  #                       FINAL against. RAW_POSTPROCESSED, so a difference the product's
  #                       number parser would have produced anyway is not credited to the
  #                       judge. Falls back to RAW, loudly, on runs built before this arm.
  #   judge_detector_arm  what the detector confusion matrix scores flags against. RAW, and
  #                       it must stay RAW: the judge's flags are a response to what the
  #                       judge was SHOWN, so its recall denominator is errors in RAW.
  #                       Pointing this at RAW_POSTPROCESSED moved detector recall from
  #                       29.9% to 40.9% purely by shrinking the denominator.
  # ONE COMPARISON RULE FOR EVERY KEY, so one number means one thing.
  #   exact      a value counts only if it is exact after normalisation -- including text and
  #              address. This is what the reported ACCURACY figure uses.
  #   threshold  text/address pass at ANLS >= 0.8 (the earlier behaviour, kept for comparison
  #              with published DocVQA-style numbers).
  # Normalisation still applies under `exact`: case, whitespace and unicode form are not the
  # thing being measured, and address components are merged before comparison because which
  # component a model puts each piece in is not a correctness question.
  match_policy: exact
  judge_baseline_arm: RAW_POSTPROCESSED
  judge_detector_arm: RAW
  # Fail rather than publish when the arms in a run do not cover an identical document set.
  # runs/main scored RAW and FINAL on 1,000 documents and RAW_POSTPROCESSED on 969, and
  # printed all three in one results.md. Override per invocation with
  # `step7_metrics.py --allow-arm-mismatch`, never here.
  require_equal_arm_denominators: true

cache:
  enabled: true
  dir: "_cache"
  # key = sha256(image) + model_id + prompt_version + image_prep_version + stage
  #       (+ a hash of the judge's input, for the judge stage)
  # image_prep_version is in the key because both model stages see the PREPARED bytes, not the
  # file on disk. The tail version is not: the tail is a free stage and is never cached, so
  # folding it in would re-pay for extraction every time a postprocessor changes.
  # Re-scoring after a metric fix must cost nothing.
