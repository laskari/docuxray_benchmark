# Non-secret run configuration. Secrets live in .env (gitignored).
#
# The measured system is FROZEN (see frozen_system_policy in mapping/fatura_field_map.yaml).
# These model ids must match what the product actually runs; they are RECORDED here, not chosen
# here. Defaults mirror ai_backend's own fallbacks.

paths:
  ai_backend: "../docuxray_ai_backend"
  # One entry per dataset, named by DatasetEntry.root_config_key in registry.py.
  # Relative paths resolve against this file's directory, so the same config works on the
  # macOS checkout and in the sandbox where the folders are mounted elsewhere.
  # NOTE 2026-09-03: the parent folder was renamed DocuXray_benchmark -> Benchmark, which left
  # this path dangling and would have failed every run at the pre-flight image check.
  dataset:        "../../Benchmark/FATURA_invoices_dataset"
  dataset_docile: "../../Benchmark/DocILE"

models:
  # ai/extraction/gemini_extraction_service.py:100  -> os.getenv("GEMINI_MODEL", ...)
  extraction: "gemini-3-flash-preview"
  # ai/judge/core/client.py:16                      -> os.environ.get("GEMINI_JUDGE_MODEL", ...)
  judge:      "gemini-3-flash-preview"

run:
  doc_type: invoice
  # Which dataset to measure. Required once a doc type has more than one: doc_type alone no
  # longer identifies the ground truth, since FATURA and DocILE100 are both invoices.
  #   fatura     10,000 synthetic invoices, 50 templates, NO line-item ground truth
  #   docile100  100 real documents, 450 annotated line-item rows, no authoritative absence
  dataset: fatura
  # What the extractor is fed. The app never extracts from the uploaded file -- it extracts
  # from the quality stage's clean image, and on the modal path those bytes are a
  # convert("RGB") + default-quality JPEG re-encode of the source (ai/quality/rotation.py:170)
  # stored under a .jpg key (shared/s3.py:67).
  #   quality_clean_jpeg  reproduce that re-encode          <- measures what ships
  #   source_bytes        pass the source file through      <- the no-detection branch
  # Changing this changes the pixels the model sees, so it is part of the response cache key.
  image_prep: quality_clean_jpeg
  # Two arms, both durable artifacts in production:
  #   RAW   = extraction + extraction_postprocessing  == pages.$.extraction_postprocessing_result
  #                                                   == exactly what judge_worker.py:88 feeds the judge
  #   FINAL = RAW + judge + refinement + postprocessing == pages.$.postprocessing_result (shipped)
  # The intermediates (bare extraction, refined-before-postprocessing) are written to
  # runs/<id>/stages/ for inspection but are not scored: they are deterministic from
  # (RAW, judge report), both of which are cached. See scripts/derive_arms.py.
  arms: [RAW, FINAL]
  concurrency: 2         # each doc fans out to 4 extraction parts then 5 judge sections;
                         # 4 docs = up to 20 concurrent calls, which trips rate limiting
  # Hard per-stage wall-clock budgets, in seconds. These are what stops a run from freezing.
  # ai/llm builds genai.Client with no http_options (gemini_provider.py:83), so there is no HTTP
  # read timeout, and the judge waits on its 5 sections with as_completed and no timeout
  # (judge.py:705) -- one section that never returns hangs that document forever. Extraction has
  # max_retries=3 with backoff; the judge has no retry path at all.
  # judge is deliberately generous: a legitimate `totals` section has been measured at 136s.
  stage_timeouts:
    extract: 300
    judge:   420
    free:     60          # the three no-model stages: extraction_postprocessing, refine, postprocess
  # Hard stop. The runner aborts and writes a partial manifest rather than overrunning.
  spend_cap_usd: 250.0
  # Abort if the first N documents project past the cap.
  early_abort_after: 10

cache:
  enabled: true
  dir: "_cache"
  # key = sha256(image) + model_id + prompt_version + image_prep_version + stage
  #       (+ a hash of the judge's input, for the judge stage)
  # image_prep_version is in the key because both model stages see the PREPARED bytes, not the
  # file on disk. The tail version is not: the tail is a free stage and is never cached, so
  # folding it in would re-pay for extraction every time a postprocessor changes.
  # Re-scoring after a metric fix must cost nothing.
