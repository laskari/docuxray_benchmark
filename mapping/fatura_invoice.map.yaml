  - {version: 0.1.1-draft, date: 2026-09-01, by: claude, change: "Added a machine-readable `labels:` list (and `label_regex` for the GST row) to every mapping row. The prose `label:` field stays as the human-facing name. No mapping semantics changed \u2014 this exists so adapters/fatura.py::check_against_yaml can verify the code has not drifted from the reviewed contract."}
  - {version: 0.1.2-draft, date: 2026-09-01, by: claude, change: "Added the BILL_TO.Name/.Email/.Tel row. adapters/fatura.py resolves BILL_TO to parties.customer when BUYER is absent (1400 files), but the map never named those three labels — check_against_yaml caught the omission. Mapping behaviour unchanged; the contract now states it."}
  - {version: 0.1.3-draft, date: 2026-09-01, by: claude, change: "Numeric target paths changed from X.originalValue to the logical path X, and numeric_value_policy added. Reason: a real pipeline output showed NumericValue carrying BOTH originalValue and normalizedValue. new_schema.py declares only originalValue because that is what the MODEL emits; ai/postprocessing/_common.py adds normalizedValue afterwards. Scoring a fixed sub-key would have zeroed arm A on every numeric. Values are now read with an accessor mirroring production's _extract_float."}
  - {version: 0.1.4-draft, date: 2026-09-01, by: naveen+claude, change: "NUMERIC_SOURCE set to originalValue (was: prefer normalizedValue). Rationale recorded in numeric_value_policy: originalValue is present at every pipeline stage and is only .strip()ed by postprocessing, so all three arms are scored on the identical field and arm differences are real pipeline differences. normalizedValue is retained as a fallback and its use rate is published as the postprocessor number-parsing failure rate."}
  - {version: 1.0-rc1, date: 2026-09-01, by: naveen, change: "Reviewer decisions applied. Q1 resolved: SUB_TOTAL -> totals.subtotal (totalExcludingTax declined). TOTAL -> totals.totalIncludingTax confirmed against page-position, schema-description, arithmetic and model evidence after totalExcludingTax was proposed and withdrawn. Tax rate -> totals.taxPercentage confirmed. Party roles SELLER/BUYER/BILL_TO/SEND_TO -> seller/customer/customer/shipTo confirmed. Added no_tax_slice_policy. 18 rows now accepted; Q2 (address components), Q3 (multi-rate tax) and Q5 (schema gaps) remain open."}
  - {version: 1.0-rc2, date: 2026-09-01, by: naveen, change: "Q2 resolved: addresses compared by MERGING the model's addressStructured sub-fields into one string and matching that against the GT block. Q3 resolved without a schema change via multi_rate_tax_policy (exclude 2 templates from scalar tax accuracy, publish the gap as a coverage statistic, measure otherCharges recovery). Q5 resolved: party website, party tax ID and bank details stay unmapped and are published as schema gaps."}
  - {version: 1.0-rc3, date: 2026-09-01, by: claude+naveen, change: "LINE_ITEMS changed from 'mapped, scored on the ok subset' to 'research_only, never scored'. Evidence: across 16 documents with real DocuXray output the GT holds 29% of printed rows, 9 of 16 have zero GT rows where rows are printed, and Template4_Instance0 is marked ok yet holds 1 row against 4 on the page (verified against the image) -- so the ok-subset filter is not a safeguard. Line items now come from CORD and the private set."}
  - {version: 1.0-rc5, date: 2026-09-01, by: naveen, change: "frozen_system_policy added: backend, ai_backend, schema and all prompts are FROZEN; the shipped system is measured as-is. The Totals.taxes list change is withdrawn. The four schema gaps become permanent published limitations rather than pending fixes. The earlier edit to tests/eval/scoring.py has been reverted to HEAD."}
  - {version: 1.0-frozen, date: 2026-09-01, by: naveen+sandeep, change: "NOTE resolved: compared against paymentTerms.raw_text + customerMemo MERGED with token-recall 0.9, because the model routes note text by content and splits a mixed NOTE across both fields -- neither single target is correct. ALL 29 ROWS NOW ACCEPTED. Reviewers: Naveen Kumar, Sandeep. The contract is frozen; further changes require a new CHANGELOG entry and both signatures."}
